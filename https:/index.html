<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Password Generator & Security Evaluator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="glass w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl border border-indigo-500/20 my-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
        Smart Password Generator
      </h1>
      <p class="text-slate-400 text-sm mt-1">& Security Evaluator</p>
    </div>

    <!-- Password Display Box -->
    <div class="relative mb-6">
      <input type="text" id="passwordOutput" readonly
        class="w-full bg-slate-900/80 text-indigo-300 font-mono text-lg sm:text-xl px-4 py-3.5 rounded-xl border border-indigo-500/30 focus:outline-none pr-28 tracking-wider text-center"
        placeholder="กดปุ่มเพื่อสร้างรหัสผ่าน">
      <button onclick="copyPassword()" 
        class="absolute right-2 top-1/2 -translate-y-1/2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg transition-all font-medium active:scale-95">
        คัดลอก
      </button>
    </div>

    <!-- Security Evaluator Badge & Entropy -->
    <div class="bg-slate-900/50 rounded-2xl p-4 border border-slate-800 mb-6 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs text-slate-400">ระดับความปลอดภัย:</span>
        <span id="securityBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold bg-slate-800 text-slate-400">
          -
        </span>
      </div>

      <!-- Strength Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="strengthBar" class="h-full w-0 transition-all duration-300 rounded-full bg-slate-600"></div>
      </div>

      <!-- Metrics Breakdown -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/60 text-xs">
        <div>
          <span class="text-slate-400">Entropy:</span>
          <span id="entropyValue" class="font-mono text-indigo-300 ml-1">0 Bits</span>
        </div>
        <div class="text-right">
          <span class="text-slate-400">Character Pool:</span>
          <span id="poolSize" class="font-mono text-indigo-300 ml-1">0</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="space-y-4 mb-6">
      <div>
        <div class="flex justify-between text-sm mb-2">
          <label class="text-slate-300">ความยาวรหัสผ่าน</label>
          <span id="lengthValue" class="font-mono font-bold text-indigo-400 text-base">16</span>
        </div>
        <input type="range" id="lengthSlider" min="8" max="64" value="16"
          class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-3 text-sm pt-2">
        <label class="flex items-center space-x-2.5 cursor-pointer bg-slate-900/40 p-2.5 rounded-xl border border-slate-800 hover:border-indigo-500/30 transition">
          <input type="checkbox" id="uppercase" checked class="rounded border-slate-700 bg-slate-800 text-indigo-500 focus:ring-0">
          <span class="text-slate-300">ตัวพิมพ์ใหญ่ (A-Z)</span>
        </label>
        <label class="flex items-center space-x-2.5 cursor-pointer bg-slate-900/40 p-2.5 rounded-xl border border-slate-800 hover:border-indigo-500/30 transition">
          <input type="checkbox" id="lowercase" checked class="rounded border-slate-700 bg-slate-800 text-indigo-500 focus:ring-0">
          <span class="text-slate-300">ตัวพิมพ์เล็ก (a-z)</span>
        </label>
        <label class="flex items-center space-x-2.5 cursor-pointer bg-slate-900/40 p-2.5 rounded-xl border border-slate-800 hover:border-indigo-500/30 transition">
          <input type="checkbox" id="numbers" checked class="rounded border-slate-700 bg-slate-800 text-indigo-500 focus:ring-0">
          <span class="text-slate-300">ตัวเลข (0-9)</span>
        </label>
        <label class="flex items-center space-x-2.5 cursor-pointer bg-slate-900/40 p-2.5 rounded-xl border border-slate-800 hover:border-indigo-500/30 transition">
          <input type="checkbox" id="symbols" checked class="rounded border-slate-700 bg-slate-800 text-indigo-500 focus:ring-0">
          <span class="text-slate-300">สัญลักษณ์ (!@#$)</span>
        </label>
      </div>
    </div>

    <!-- Generate Button -->
    <button onclick="generatePassword()"
      class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-indigo-500/25 transition-all active:scale-[0.98]">
      สร้างรหัสผ่านใหม่
    </button>

    <!-- Toast Alert -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
      คัดลอกรหัสผ่านแล้ว!
    </div>
  </div>

  <script>
    const chars = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    const slider = document.getElementById('lengthSlider');
    const lengthVal = document.getElementById('lengthValue');

    slider.addEventListener('input', (e) => {
      lengthVal.textContent = e.target.value;
      generatePassword();
    });

    ['uppercase', 'lowercase', 'numbers', 'symbols'].forEach(id => {
      document.getElementById(id).addEventListener('change', generatePassword);
    });

    function generatePassword() {
      let pool = '';
      let poolSize = 0;

      if (document.getElementById('uppercase').checked) { pool += chars.uppercase; poolSize += 26; }
      if (document.getElementById('lowercase').checked) { pool += chars.lowercase; poolSize += 26; }
      if (document.getElementById('numbers').checked) { pool += chars.numbers; poolSize += 10; }
      if (document.getElementById('symbols').checked) { pool += chars.symbols; poolSize += 32; }

      if (!pool) {
        document.getElementById('passwordOutput').value = 'เลือกอย่างน้อย 1 ตัวเลือก';
        updateMetrics(0, 0);
        return;
      }

      const length = parseInt(slider.value);
      let password = '';
      const array = new Uint32Array(length);
      window.crypto.getRandomValues(array);

      for (let i = 0; i < length; i++) {
        password += pool[array[i] % pool.length];
      }

      document.getElementById('passwordOutput').value = password;
      
      // Calculate Entropy: E = L * log2(R)
      const entropy = length * Math.log2(poolSize);
      updateMetrics(entropy, poolSize);
    }

    function updateMetrics(entropy, poolSize) {
      document.getElementById('entropyValue').textContent = `${entropy.toFixed(1)} Bits`;
      document.getElementById('poolSize').textContent = poolSize;

      const badge = document.getElementById('securityBadge');
      const bar = document.getElementById('strengthBar');

      let level = '', color = '', width = '0%';

      if (entropy === 0) {
        level = 'ไม่ปลอดภัย'; color = 'bg-slate-800 text-slate-400'; width = '0%';
      } else if (entropy < 28) {
        level = 'อ่อนมาก (Weak)'; color = 'bg-red-500/20 text-red-400 border border-red-500/30'; width = '20%';
      } else if (entropy < 36) {
        level = 'พอใช้ (Fair)'; color = 'bg-orange-500/20 text-orange-400 border border-orange-500/30'; width = '40%';
      } else if (entropy < 60) {
        level = 'ปานกลาง (Good)'; color = 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'; width = '60%';
      } else if (entropy < 128) {
        level = 'แข็งแกร่ง (Strong)'; color = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'; width = '85%';
      } else {
        level = 'ปลอดภัยสูงสุด (Very Strong)'; color = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'; width = '100%';
      }

      badge.textContent = level;
      badge.className = `text-xs px-2.5 py-1 rounded-full font-semibold ${color}`;
      bar.style.width = width;
      bar.className = `h-full transition-all duration-300 rounded-full ${color.split(' ')[0]}`;
    }

    function copyPassword() {
      const pwd = document.getElementById('passwordOutput').value;
      if (!pwd || pwd.includes('เลือกอย่างน้อย')) return;

      navigator.clipboard.writeText(pwd).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2000);
      });
    }

    // Initial run
    generatePassword();
  </script>
</body>
</html>
